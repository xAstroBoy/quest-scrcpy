[package]
name = "quest-scrcpy"
version = "0.1.0"
edition = "2024"
description = "Native Rust scrcpy client tuned for the Meta Quest 3 (one-eye live crop)."

[dependencies]
anyhow = "1.0.102"
bytemuck = "1.25.0"
clap = { version = "4.6.1", features = ["derive"] }
cpal = "0.18.1"
crossbeam-channel = "0.5.15"
eframe = { version = "0.34.3", features = ["wgpu"] }
egui = "0.34.3"
image = { version = "0.25.10", default-features = false, features = ["png"] }
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_Media_MediaFoundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_System_Threading",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Ole",
    "Win32_System_Variant",
] }

[profile.release]
opt-level = 3
lto = "thin"

[profile.dev]
opt-level = 1
