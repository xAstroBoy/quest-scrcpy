name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  # Windows: the only platform that builds today (the decode stack uses Windows
  # Media Foundation). Linux/macOS jobs get added once the decode/audio pipeline
  # is ported to a cross-platform backend (openh264 + symphonia).
  windows:
    name: Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build (release)
        run: cargo build --release
      - name: Stage artifact
        shell: pwsh
        run: Copy-Item target/release/quest-scrcpy.exe "quest-scrcpy-${{ github.ref_name }}-windows-x64.exe"
      - name: Publish to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: quest-scrcpy-*-windows-x64.exe
          generate_release_notes: true
